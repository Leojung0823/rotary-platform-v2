name: Probe LINE Transfer Staging Rollout

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  actions: read
  contents: read

jobs:
  report:
    if: github.head_ref == 'ops/staging-rollout-line-transfer-956fb21'
    runs-on: ubuntu-latest
    steps:
      - name: Report rollout runs and live health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: 956fb219ef731bec91512b5417747fb4ed4333aa
          STAGING_BASE_URL: https://rotary-platform-v2.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const targetSha = process.env.TARGET_SHA;
          const baseUrl = process.env.STAGING_BASE_URL;
          const response = await fetch(`https://api.github.com/repos/${repository}/actions/runs?per_page=100`, {
            headers: {
              accept: "application/vnd.github+json",
              authorization: `Bearer ${token}`,
              "x-github-api-version": "2022-11-28",
            },
          });
          if (!response.ok) throw new Error(`GitHub status request failed with ${response.status}.`);
          const result = await response.json();
          const runs = (result.workflow_runs ?? [])
            .filter((run) => run.head_sha === targetSha || ["Staging Release", "Staging Go-Live"].includes(run.name))
            .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))
            .slice(0, 20);
          console.log(`Target revision: ${targetSha}`);
          for (const run of runs) {
            console.log(`${run.name} #${run.run_number} / ${run.id}: ${run.status}${run.conclusion ? ` (${run.conclusion})` : ""}; head ${run.head_sha}; event ${run.event}`);
          }
          try {
            const health = await fetch(`${baseUrl}/api/health`, {
              redirect: "manual",
              headers: { accept: "application/json", "user-agent": "rotary-staging-probe" },
              signal: AbortSignal.timeout(20_000),
            });
            const body = await health.json();
            console.log(`Live health HTTP ${health.status}.`);
            console.log(`Live health status: ${String(body.status ?? "unknown")}`);
            console.log(`Live environment: ${String(body.environment ?? "unknown")}`);
            console.log(`Live revision: ${String(body.revision ?? "unknown")}`);
          } catch (error) {
            console.log(`Live health request failed: ${error instanceof Error ? error.message : String(error)}`);
          }
          NODE
