name: Message Center Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: message-center-scheduler-staging
  cancel-in-progress: false

jobs:
  run-staging-scheduler:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.MESSAGE_CENTER_SCHEDULER_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: message-center-scheduler
      url: ${{ vars.STAGING_BASE_URL }}
    env:
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      MESSAGE_CENTER_SCHEDULER_SECRET: ${{ secrets.MESSAGE_CENTER_SCHEDULER_SECRET }}
    steps:
      - name: Trigger the protected staging scheduler
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STAGING_BASE_URL" == https://* ]] || {
            echo "STAGING_BASE_URL must be an HTTPS origin."
            exit 1
          }
          [[ -n "$MESSAGE_CENTER_SCHEDULER_SECRET" ]] || {
            echo "MESSAGE_CENTER_SCHEDULER_SECRET is not configured."
            exit 1
          }
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --max-time 30 \
            -X POST "${STAGING_BASE_URL%/}/api/internal/message-center/scheduler" \
            -H "Authorization: Bearer ${MESSAGE_CENTER_SCHEDULER_SECRET}" \
            -H "Accept: application/json"
