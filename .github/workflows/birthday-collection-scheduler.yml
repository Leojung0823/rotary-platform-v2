name: Birthday Collection Scheduler

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: birthday-collection-scheduler-staging
  cancel-in-progress: false

jobs:
  run-staging-scheduler:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: staging
      url: ${{ vars.STAGING_BASE_URL }}
    env:
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      BIRTHDAY_COLLECTION_SCHEDULER_SECRET: ${{ secrets.BIRTHDAY_COLLECTION_SCHEDULER_SECRET }}
    steps:
      - name: Trigger the protected staging scheduler
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STAGING_BASE_URL" == https://* ]] || {
            echo "STAGING_BASE_URL must be an HTTPS origin."
            exit 1
          }
          [[ -n "$BIRTHDAY_COLLECTION_SCHEDULER_SECRET" ]] || {
            echo "BIRTHDAY_COLLECTION_SCHEDULER_SECRET is not configured."
            exit 1
          }
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --max-time 30 \
            -X POST "${STAGING_BASE_URL%/}/api/internal/birthday-collection/scheduler" \
            -H "Authorization: Bearer ${BIRTHDAY_COLLECTION_SCHEDULER_SECRET}" \
            -H "Accept: application/json"
