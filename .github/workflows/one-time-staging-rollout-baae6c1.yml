name: One-time Staging Rollout baae6c1

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  actions: write

concurrency:
  group: one-time-staging-rollout-baae6c1
  cancel-in-progress: false

jobs:
  orchestrate:
    if: github.head_ref == 'ops/staging-rollout-baae6c1'
    name: Verify backup and launch protected rollout
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: staging
      url: ${{ vars.STAGING_BASE_URL }}
    env:
      TARGET_SHA: baae6c1749e5a4b8713ef9e8afe2be696db16a98
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Verify immutable main revision and usable staging backup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const targetSha = process.env.TARGET_SHA;
          const githubToken = process.env.GITHUB_TOKEN;
          const supabaseToken = process.env.SUPABASE_ACCESS_TOKEN;
          const projectRef = process.env.SUPABASE_PROJECT_REF;

          if (!repository || !/^[0-9a-f]{40}$/.test(targetSha ?? "")) throw new Error("Invalid rollout target.");
          if (!githubToken || !supabaseToken || !projectRef) throw new Error("Protected staging configuration is incomplete.");

          async function request(url, token, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${token}`,
                "content-type": "application/json",
                ...(options.headers ?? {}),
              },
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`Protected API request failed with status ${response.status}.`);
            return text ? JSON.parse(text) : null;
          }

          const main = await request(`https://api.github.com/repos/${repository}/commits/main`, githubToken, {
            headers: { "x-github-api-version": "2022-11-28" },
          });
          if (main?.sha !== targetSha) throw new Error("Main moved after approval; refusing to deploy a different revision.");

          const project = await request(`https://api.supabase.com/v1/projects/${encodeURIComponent(projectRef)}`, supabaseToken);
          if (project?.ref !== projectRef || !/staging/i.test(String(project?.name ?? ""))) {
            throw new Error("Supabase project identity is not an approved staging project.");
          }

          const backupState = await request(
            `https://api.supabase.com/v1/projects/${encodeURIComponent(projectRef)}/database/backups`,
            supabaseToken,
          );
          const now = Date.now();
          const maxAgeMs = 36 * 60 * 60 * 1000;
          const completed = Array.isArray(backupState?.backups)
            ? backupState.backups.filter((backup) => String(backup?.status ?? "").toUpperCase() === "COMPLETED")
            : [];
          const latestLogicalMs = completed
            .map((backup) => Date.parse(String(backup?.inserted_at ?? "")))
            .filter(Number.isFinite)
            .sort((a, b) => b - a)[0] ?? 0;
          const latestPhysicalSeconds = Number(backupState?.physical_backup_data?.latest_physical_backup_date_unix ?? 0);
          const latestPhysicalMs = Number.isFinite(latestPhysicalSeconds) ? latestPhysicalSeconds * 1000 : 0;
          const latestBackupMs = Math.max(latestLogicalMs, latestPhysicalMs);

          if (!latestBackupMs || now - latestBackupMs > maxAgeMs || latestBackupMs > now + 5 * 60 * 1000) {
            throw new Error("No recent completed staging backup or PITR restore point was verified.");
          }

          console.log("Immutable main revision, staging project identity, and recent backup were verified.");
          NODE

      - name: Dispatch and verify the staging migration plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const targetSha = process.env.TARGET_SHA;
          const startedAt = new Date(Date.now() - 5000).toISOString();

          async function api(path, options = {}) {
            const response = await fetch(`https://api.github.com/repos/${repository}${path}`, {
              ...options,
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${token}`,
                "content-type": "application/json",
                "x-github-api-version": "2022-11-28",
                ...(options.headers ?? {}),
              },
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`GitHub Actions request failed with status ${response.status}.`);
            return text ? JSON.parse(text) : null;
          }

          await api("/actions/workflows/staging-release.yml/dispatches", {
            method: "POST",
            body: JSON.stringify({ ref: "main", inputs: { operation: "plan" } }),
          });

          let run = null;
          for (let attempt = 0; attempt < 60; attempt += 1) {
            const result = await api("/actions/workflows/staging-release.yml/runs?event=workflow_dispatch&branch=main&per_page=20");
            run = result?.workflow_runs?.find((candidate) =>
              candidate.head_sha === targetSha
              && candidate.event === "workflow_dispatch"
              && candidate.created_at >= startedAt
            ) ?? null;
            if (run) break;
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          if (!run) throw new Error("The staging migration plan run could not be located.");

          for (let attempt = 0; attempt < 180; attempt += 1) {
            run = await api(`/actions/runs/${run.id}`);
            if (run.status === "completed") break;
            await new Promise((resolve) => setTimeout(resolve, 10000));
          }
          if (run?.status !== "completed" || run?.conclusion !== "success") {
            throw new Error("The staging migration plan did not complete successfully.");
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `run_id=${run.id}\n`);
          console.log(`The protected staging migration plan completed successfully (run ${run.id}).`);
          NODE

      - name: Dispatch and wait for protected staging go-live
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ steps.plan.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const targetSha = process.env.TARGET_SHA;
          const planRunId = process.env.PLAN_RUN_ID;
          const startedAt = new Date(Date.now() - 5000).toISOString();

          async function api(path, options = {}) {
            const response = await fetch(`https://api.github.com/repos/${repository}${path}`, {
              ...options,
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${token}`,
                "content-type": "application/json",
                "x-github-api-version": "2022-11-28",
                ...(options.headers ?? {}),
              },
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`GitHub Actions request failed with status ${response.status}.`);
            return text ? JSON.parse(text) : null;
          }

          await api("/actions/workflows/staging-go-live.yml/dispatches", {
            method: "POST",
            body: JSON.stringify({
              ref: "main",
              inputs: {
                expected_sha: targetSha,
                plan_run_id: String(planRunId),
                confirmation: "LAUNCH-STAGING",
                backup_confirmation: "BACKUP-READY",
                provision_test_data: "false",
                provisioning_confirmation: "",
              },
            }),
          });

          let run = null;
          for (let attempt = 0; attempt < 60; attempt += 1) {
            const result = await api("/actions/workflows/staging-go-live.yml/runs?event=workflow_dispatch&branch=main&per_page=20");
            run = result?.workflow_runs?.find((candidate) =>
              candidate.head_sha === targetSha
              && candidate.event === "workflow_dispatch"
              && candidate.created_at >= startedAt
            ) ?? null;
            if (run) break;
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          if (!run) throw new Error("The protected staging go-live run could not be located.");

          for (let attempt = 0; attempt < 360; attempt += 1) {
            run = await api(`/actions/runs/${run.id}`);
            if (run.status === "completed") break;
            await new Promise((resolve) => setTimeout(resolve, 10000));
          }
          if (run?.status !== "completed" || run?.conclusion !== "success") {
            throw new Error(`The protected staging go-live did not complete successfully (run ${run?.id ?? "unknown"}).`);
          }

          console.log(`Staging migration, deployment, smoke, and hosted acceptance completed successfully (run ${run.id}).`);
          NODE
