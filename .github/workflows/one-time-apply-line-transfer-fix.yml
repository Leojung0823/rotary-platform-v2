name: One-time apply LINE transfer fix

on:
  push:
    branches:
      - fix/line-transfer-after-unbind

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/line-transfer-after-unbind
          fetch-depth: 0

      - name: Apply person-scoped LINE Auth identity fix
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          route_path = Path("src/app/api/auth/line/callback/route.ts")
          route = route_path.read_text()

          provider_import = 'import { exchangeLineCode, lineMode } from "@/lib/line/provider";\n'
          helper_import = 'import { lineIdentityLoginEmail } from "@/lib/line/identity-login-email";\n'
          if helper_import not in route:
              if provider_import not in route:
                  raise SystemExit("provider import anchor not found")
              route = route.replace(provider_import, provider_import + helper_import, 1)

          old_email = 'loginEmail = `line-${digest(profile.subject).slice(0, 24)}@identity.local`;'
          new_email = 'loginEmail = lineIdentityLoginEmail(profile.subject, invitationPersonId);'
          if old_email in route:
              route = route.replace(old_email, new_email, 1)
          elif new_email not in route:
              raise SystemExit("LINE synthetic email anchor not found")

          route_path.write_text(route)

          helper_path = Path("src/lib/line/identity-login-email.ts")
          helper_path.write_text('''import { createHash } from "node:crypto";\n\nexport function lineIdentityLoginEmail(providerSubject: string, personId: string) {\n  const identityKey = `${providerSubject}:${personId}`;\n  const suffix = createHash("sha256").update(identityKey).digest("hex").slice(0, 24);\n  return `line-${suffix}@identity.local`;\n}\n''')

          test_path = Path("src/lib/line/identity-login-email.test.ts")
          test_path.write_text('''import { describe, expect, it } from "vitest";\nimport { lineIdentityLoginEmail } from "./identity-login-email";\n\ndescribe("LINE identity login email", () => {\n  it("is stable for the same LINE identity and person", () => {\n    expect(lineIdentityLoginEmail("Utest12345678", "person-a"))\n      .toBe(lineIdentityLoginEmail("Utest12345678", "person-a"));\n  });\n\n  it("allows an unbound LINE identity to move to a different person without Auth email collision", () => {\n    expect(lineIdentityLoginEmail("Utest12345678", "person-a"))\n      .not.toBe(lineIdentityLoginEmail("Utest12345678", "person-b"));\n  });\n});\n''')

          Path(".github/workflows/one-time-apply-line-transfer-fix.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: allow LINE reassignment after administrator unbind"
          git push origin HEAD:fix/line-transfer-after-unbind
