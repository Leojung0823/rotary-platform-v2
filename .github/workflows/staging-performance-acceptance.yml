name: Staging Performance Acceptance

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Enter the exact 40-character commit SHA currently deployed to staging"
        required: true
        type: string
      confirmation:
        description: "Enter TEST-STAGING-PERFORMANCE"
        required: true
        type: string
      sample_count:
        description: "Number of same-condition samples per page"
        required: true
        default: "3"
        type: choice
        options:
          - "3"
          - "5"
      cache_mode:
        description: "Use cold (cache disabled) or warm (primed) browser cache; do not mix runs"
        required: true
        default: "warm"
        type: choice
        options:
          - warm
          - cold

permissions:
  contents: read

concurrency:
  group: staging-performance-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: Hosted staging performance baseline
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.STAGING_BASE_URL }}
    env:
      STAGING_EXPECTED_SHA: ${{ inputs.expected_sha }}
      STAGING_PERFORMANCE_CONFIRMATION: ${{ inputs.confirmation }}
      STAGING_PERFORMANCE_SAMPLE_COUNT: ${{ inputs.sample_count }}
      STAGING_PERFORMANCE_CACHE_MODE: ${{ inputs.cache_mode }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      STAGING_EXPECTED_CLUB_NAME: ${{ vars.STAGING_EXPECTED_CLUB_NAME }}
      STAGING_TEST_MEMBER_EMAIL: ${{ secrets.STAGING_TEST_MEMBER_EMAIL }}
      STAGING_TEST_MEMBER_PASSWORD: ${{ secrets.STAGING_TEST_MEMBER_PASSWORD }}
      STAGING_TEST_OPERATOR_EMAIL: ${{ secrets.STAGING_TEST_OPERATOR_EMAIL }}
      STAGING_TEST_OPERATOR_PASSWORD: ${{ secrets.STAGING_TEST_OPERATOR_PASSWORD }}
      E2E_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      E2E_EXPECTED_SHA: ${{ inputs.expected_sha }}
      E2E_REMOTE: "1"
      E2E_SENSITIVE: "1"

    steps:
      - name: Check out current main test revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Validate manual acceptance inputs
        run: node scripts/verify-staging-performance-acceptance-inputs.mjs

      - name: Verify staged revision is in current main history
        shell: bash
        run: |
          git cat-file -e "$STAGING_EXPECTED_SHA^{commit}"
          git merge-base --is-ancestor "$STAGING_EXPECTED_SHA" "$GITHUB_SHA"
          echo "Staging revision is an ancestor of the current main test revision."

      - name: Install isolated browser test dependencies
        run: npm ci --prefix e2e

      - name: Install Chromium and operating-system dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if timeout -k 30 240 npm --prefix e2e run install:chromium; then
              exit 0
            fi
            echo "Chromium install attempt ${attempt} failed or stalled; retrying."
            sudo pkill -9 -x apt-get 2>/dev/null || true
            sudo pkill -9 -x dpkg 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock 2>/dev/null || true
            sudo dpkg --configure -a 2>/dev/null || true
            sleep 20
          done
          echo "Chromium install did not succeed after 3 attempts."
          exit 1

      - name: Run protected hosted staging performance baseline
        env:
          STAGING_PERFORMANCE_OUTPUT: ${{ runner.temp }}/staging-performance-results.json
        run: npm --prefix e2e run test:staging-performance -- --project=desktop-chromium

      - name: Record performance baseline in the job summary
        if: success()
        env:
          STAGING_PERFORMANCE_OUTPUT: ${{ runner.temp }}/staging-performance-results.json
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";

          const results = JSON.parse(await readFile(process.env.STAGING_PERFORMANCE_OUTPUT, "utf8"));
          const lines = [
            "### Hosted staging performance baseline passed",
            `- Staging revision: \`${results.expectedSha}\``,
            `- Samples per page: ${results.sampleCount}`,
            `- Browser cache condition: ${results.cacheMode}`,
            `- Measurement source: ${results.measurementSource}`,
            "- Metrics were collected after protected member/operator login in the same staging runtime.",
            "- INP is reported as unmeasured when the browser exposes no qualifying Event Timing entry; no value is synthesized.",
            "- DevTools trace summaries keep only event counts and long-task durations; raw trace data was discarded.",
            "- No email address, password, page content, screenshots, video or HTML report was retained.",
            "",
            "| Page | Sample | LCP (ms) | FCP (ms) | TTFB (ms) | INP (ms) |",
            "| --- | ---: | ---: | ---: | ---: | ---: |",
          ];
          for (const route of results.routes) {
            for (const sample of route.samples) {
              lines.push(`| ${route.label} | ${sample.sample} | ${sample.lcpMs} | ${sample.fcpMs} | ${sample.ttfbMs} | ${sample.inpMs ?? "unmeasured"} |`);
            }
          }
          lines.push("", "| Page | Trace events | Long tasks (>=50 ms) | Longest long task (ms) | Raw trace retained |", "| --- | ---: | ---: | ---: | ---: |");
          for (const route of results.routes) {
            lines.push(`| ${route.label} | ${route.trace.eventCount} | ${route.trace.longTaskCount} | ${route.trace.longestLongTaskMs} | ${route.trace.rawTraceRetained} |`);
          }
          await appendFile(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          console.log(lines.join("\n"));
          NODE
