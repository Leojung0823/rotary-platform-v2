name: Probe Main Staging Rollout PR46

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  actions: read
  contents: read

jobs:
  report:
    if: github.head_ref == 'ops/staging-rollout-baae6c1'
    runs-on: ubuntu-latest
    steps:
      - name: Report current rollout runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAIN_ROLLOUT_SHA: 748dcfd1f028f59996eef3d880ab5b7d0b2238ee
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const rolloutSha = process.env.MAIN_ROLLOUT_SHA;

          const response = await fetch(`https://api.github.com/repos/${repository}/actions/runs?per_page=100`, {
            headers: {
              accept: "application/vnd.github+json",
              authorization: `Bearer ${token}`,
              "x-github-api-version": "2022-11-28",
            },
          });
          if (!response.ok) throw new Error(`GitHub status request failed with status ${response.status}.`);
          const result = await response.json();
          const runs = result?.workflow_runs ?? [];
          const relevant = runs
            .filter((run) => run.head_sha === rolloutSha || ["Staging Release", "Staging Go-Live"].includes(run.name))
            .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))
            .slice(0, 12);

          console.log(`Main rollout revision: ${rolloutSha}`);
          if (!relevant.length) console.log("No matching workflow run was found.");
          for (const run of relevant) {
            console.log(`${run.name} #${run.run_number} / ${run.id}: ${run.status}${run.conclusion ? ` (${run.conclusion})` : ""}; head ${run.head_sha}; event ${run.event}`);
          }
          NODE
