name: Probe Main Staging Rollout PR46

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report:
    if: github.head_ref == 'ops/staging-rollout-baae6c1'
    runs-on: ubuntu-latest
    steps:
      - name: Report current rollout runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAIN_ROLLOUT_SHA: 0393599d56c2348faa0888d58dd48baf405e673c
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const rolloutSha = process.env.MAIN_ROLLOUT_SHA;

          async function api(path, options = {}) {
            const response = await fetch(`https://api.github.com/repos/${repository}${path}`, {
              ...options,
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${token}`,
                "content-type": "application/json",
                "x-github-api-version": "2022-11-28",
              },
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`GitHub status request failed with status ${response.status}.`);
            return text ? JSON.parse(text) : null;
          }

          const result = await api("/actions/runs?per_page=100");
          const runs = result?.workflow_runs ?? [];
          const relevant = runs
            .filter((run) => run.head_sha === rolloutSha || ["Staging Release", "Staging Go-Live"].includes(run.name))
            .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))
            .slice(0, 10);
          const lines = relevant.map((run) =>
            `- ${run.name} #${run.run_number} / ${run.id}: ${run.status}${run.conclusion ? ` (${run.conclusion})` : ""}; head \`${run.head_sha}\`; event ${run.event}`
          );
          const body = [
            "### Current staging rollout runs",
            `- Main rollout revision: \`${rolloutSha}\``,
            ...(lines.length ? lines : ["- No matching workflow run was found."]),
          ].join("\n");

          await api("/issues/46/comments", {
            method: "POST",
            body: JSON.stringify({ body }),
          });
          NODE
