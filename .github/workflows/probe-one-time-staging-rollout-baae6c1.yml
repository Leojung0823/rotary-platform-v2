name: Probe Main Staging Rollout PR49

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  actions: read
  contents: read

jobs:
  report:
    if: github.head_ref == 'ops/staging-rollout-baae6c1'
    runs-on: ubuntu-latest
    steps:
      - name: Report rollout runs and live health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAIN_ROLLOUT_SHA: 117f5f8d8361ec7e31841f980c5c0b5436367fd5
          STAGING_BASE_URL: https://rotary-platform-v2.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const rolloutSha = process.env.MAIN_ROLLOUT_SHA;
          const baseUrl = process.env.STAGING_BASE_URL;

          const response = await fetch(`https://api.github.com/repos/${repository}/actions/runs?per_page=100`, {
            headers: {
              accept: "application/vnd.github+json",
              authorization: `Bearer ${token}`,
              "x-github-api-version": "2022-11-28",
            },
          });
          if (!response.ok) throw new Error(`GitHub status request failed with status ${response.status}.`);
          const result = await response.json();
          const runs = result?.workflow_runs ?? [];
          const relevant = runs
            .filter((run) => run.head_sha === rolloutSha || ["Staging Release", "Staging Go-Live"].includes(run.name))
            .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))
            .slice(0, 15);

          console.log(`Main rollout revision: ${rolloutSha}`);
          if (!relevant.length) console.log("No matching workflow run was found.");
          for (const run of relevant) {
            console.log(`${run.name} #${run.run_number} / ${run.id}: ${run.status}${run.conclusion ? ` (${run.conclusion})` : ""}; head ${run.head_sha}; event ${run.event}`);
          }

          try {
            const health = await fetch(`${baseUrl}/api/health`, {
              redirect: "manual",
              headers: { accept: "application/json", "user-agent": "rotary-staging-probe" },
              signal: AbortSignal.timeout(20000),
            });
            const text = await health.text();
            console.log(`Live health HTTP ${health.status}.`);
            try {
              const body = JSON.parse(text);
              console.log(`Live health status: ${String(body.status ?? "unknown")}`);
              console.log(`Live environment: ${String(body.environment ?? "unknown")}`);
              console.log(`Live revision: ${String(body.revision ?? "unknown")}`);
            } catch {
              console.log(`Live health body was not JSON; length ${text.length}.`);
            }
          } catch (error) {
            console.log(`Live health request failed: ${error instanceof Error ? error.message : "unknown error"}`);
          }
          NODE
