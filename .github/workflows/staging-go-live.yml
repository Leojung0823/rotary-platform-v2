name: Staging Go-Live

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact 40-character main commit SHA approved by the Staging Release plan"
        required: true
        type: string
      plan_run_id:
        description: "Successful Staging Release plan workflow run id for the same SHA"
        required: true
        type: string
      confirmation:
        description: "Enter LAUNCH-STAGING"
        required: true
        type: string
      backup_confirmation:
        description: "Confirm a usable staging backup/rollback point by entering BACKUP-READY"
        required: true
        type: string
      provision_test_data:
        description: "Create or confirm the pure-test club and member for a brand-new staging project"
        required: true
        type: boolean
        default: false
      provisioning_confirmation:
        description: "When provisioning is enabled, enter PROVISION-STAGING-TEST-DATA"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: staging-go-live
  cancel-in-progress: false

jobs:
  launch:
    name: Apply, deploy and accept staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
      url: ${{ vars.STAGING_BASE_URL }}
    env:
      STAGING_EXPECTED_SHA: ${{ inputs.expected_sha }}
      STAGING_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      STAGING_LAUNCH_CONFIRMATION: ${{ inputs.confirmation }}
      STAGING_BACKUP_CONFIRMATION: ${{ inputs.backup_confirmation }}
      STAGING_PROVISION_TEST_DATA: ${{ inputs.provision_test_data }}
      STAGING_PROVISIONING_CONFIRMATION: ${{ inputs.provisioning_confirmation }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      STAGING_EXPECTED_CLUB_NAME: ${{ vars.STAGING_EXPECTED_CLUB_NAME }}
      E2E_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      E2E_EXPECTED_SHA: ${{ inputs.expected_sha }}
      E2E_REMOTE: "1"
      E2E_SENSITIVE: "1"
      STAGING_EXPECT_ENV: staging
      APP_ENV: staging
      TRUSTED_ADMIN_ENVIRONMENT: staging

    steps:
      - name: Check out the immutable launch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Install application dependencies
        run: npm ci

      - name: Install isolated browser test dependencies
        run: npm ci --prefix e2e

      - name: Install Chromium and operating-system dependencies
        shell: bash
        run: |
          # Installing OS dependencies reaches the runner's Ubuntu mirror, which
          # stalls rather than failing when the mirror is unreachable -- that
          # turns a transient outage into a job that burns its entire timeout.
          # Bound each attempt so a stall fails fast, and retry, because the
          # mirror has consistently recovered within minutes.
          for attempt in 1 2 3; do
            if timeout 360 npm --prefix e2e run install:chromium; then
              exit 0
            fi
            echo "Chromium install attempt ${attempt} failed or stalled; retrying."
            sleep 20
          done
          echo "Chromium install did not succeed after 3 attempts."
          exit 1

      - name: Validate protected go-live inputs and credentials
        id: go_live_inputs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          STAGING_DEPLOY_HOOK: ${{ secrets.STAGING_DEPLOY_HOOK }}
          STAGING_TEST_MEMBER_EMAIL: ${{ secrets.STAGING_TEST_MEMBER_EMAIL }}
          STAGING_TEST_MEMBER_PASSWORD: ${{ secrets.STAGING_TEST_MEMBER_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-staging-go-live-inputs.mjs

      - name: Verify the approved staging migration plan
        id: migration_plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-staging-plan-run.mjs

      - name: Verify repository release invariants
        run: |
          npm run check:migrations
          npm run check:db-verifications

      - name: Verify the Hosted Supabase staging project identity
        id: staging_project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_PROJECT_REFS: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REFS }}
          PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_URLS: ${{ vars.PRODUCTION_SUPABASE_URLS }}
        run: node scripts/verify-staging-project-identity.mjs

      - name: Validate optional initial provisioning credentials
        if: inputs.provision_test_data == true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_TEST_MEMBER_EMAIL: ${{ secrets.STAGING_TEST_MEMBER_EMAIL }}
          STAGING_TEST_MEMBER_PASSWORD: ${{ secrets.STAGING_TEST_MEMBER_PASSWORD }}
          STAGING_SHA_VERIFIED: ${{ steps.go_live_inputs.outputs.sha_verified }}
          STAGING_PLAN_VERIFIED: ${{ steps.migration_plan.outputs.verified }}
          STAGING_PROJECT_IDENTITY_VERIFIED: ${{ steps.staging_project.outputs.verified }}
        run: node scripts/provision-staging-test-data.mjs --preflight

      - name: Link the exact staging Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Repeat the remote migration dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --dry-run

      - name: Apply remote migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked

      - name: Provision or confirm initial staging test data
        if: inputs.provision_test_data == true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_TEST_MEMBER_EMAIL: ${{ secrets.STAGING_TEST_MEMBER_EMAIL }}
          STAGING_TEST_MEMBER_PASSWORD: ${{ secrets.STAGING_TEST_MEMBER_PASSWORD }}
          STAGING_SHA_VERIFIED: ${{ steps.go_live_inputs.outputs.sha_verified }}
          STAGING_PLAN_VERIFIED: ${{ steps.migration_plan.outputs.verified }}
          STAGING_PROJECT_IDENTITY_VERIFIED: ${{ steps.staging_project.outputs.verified }}
        run: node scripts/provision-staging-test-data.mjs

      - name: Trigger the protected staging deployment hook
        env:
          STAGING_DEPLOY_HOOK: ${{ secrets.STAGING_DEPLOY_HOOK }}
        run: node scripts/trigger-staging-deploy.mjs

      - name: Wait for the exact deployed revision
        run: node scripts/wait-for-staging-revision.mjs

      - name: Run HTTPS staging smoke tests
        run: npm run smoke:staging

      - name: Run protected hosted member acceptance
        env:
          STAGING_TEST_MEMBER_EMAIL: ${{ secrets.STAGING_TEST_MEMBER_EMAIL }}
          STAGING_TEST_MEMBER_PASSWORD: ${{ secrets.STAGING_TEST_MEMBER_PASSWORD }}
        run: npm --prefix e2e run test:staging

      - name: Record successful staging go-live
        if: success()
        shell: bash
        run: |
          {
            echo "### Staging go-live passed"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Approved plan run: \`${STAGING_PLAN_RUN_ID}\`"
            echo "- Migration dry-run and apply completed."
            echo "- Optional initial staging test-data provisioning respected its explicit gate."
            echo "- Exact deployment revision became healthy."
            echo "- HTTPS smoke and hosted member browser acceptance passed."
            echo "- No browser screenshots, video, trace or HTML report were retained."
          } >> "$GITHUB_STEP_SUMMARY"
