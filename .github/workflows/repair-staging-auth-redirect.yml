name: Sync Staging Auth Redirect And Recovery Email

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-staging-auth-redirect.yml
      - scripts/sync-staging-auth-config.mjs
      - src/lib/staging-auth-config.mjs
      - supabase/templates/recovery.html
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-staging-auth-redirect
  cancel-in-progress: false

jobs:
  repair:
    name: Sync staging Auth URLs and recovery email
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      APP_ENV: staging
      TRUSTED_ADMIN_ENVIRONMENT: staging
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}

    steps:
      - name: Check out the exact workflow revision
        uses: actions/checkout@v4

      - name: Sync and verify protected staging Auth configuration
        run: node scripts/sync-staging-auth-config.mjs
