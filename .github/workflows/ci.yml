name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}
      - name: Start local Supabase database
        run: supabase db start
      - name: Reset database from migrations
        run: supabase db reset --local
      - name: Lint database schema
        run: supabase db lint --local
      - name: Verify identity and provisioning invariants
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for file in \
            supabase/verification/core_identity_baseline.sql \
            supabase/verification/provisioning_security.sql \
            supabase/verification/operator_expiry_consistency.sql \
            supabase/verification/invitation_selection.sql
          do
            psql \
              --host 127.0.0.1 \
              --port 54322 \
              --username postgres \
              --dbname postgres \
              --set ON_ERROR_STOP=1 \
              --file "$file"
          done
