name: Quality
on:
  pull_request:
jobs:
  change-scope:
    name: Decide whether full gates are needed
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.scope.outputs.run_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: scope
        run: node .github/scripts/classify-change-scope.mjs >> "$GITHUB_OUTPUT"

  application:
    needs: change-scope
    if: needs.change-scope.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check:migrations
      - run: npm run check:db-verifications
      - run: npm run lint
      - name: Run TypeScript typecheck
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
      - name: Upload failed typecheck log
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: /tmp/typecheck.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail when typecheck failed
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/unit-test.log
      - name: Upload failed unit test log
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: /tmp/unit-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail when unit tests failed
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-ci-placeholder
