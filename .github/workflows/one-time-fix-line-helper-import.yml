name: One-time fix LINE helper import

on:
  push:
    branches:
      - fix/line-transfer-after-unbind

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/line-transfer-after-unbind
          fetch-depth: 0
      - name: Use route-local helper import
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path("src/app/api/auth/line/callback/route.ts")
          text = path.read_text()
          old = 'import { lineIdentityLoginEmail } from "@/lib/line/identity-login-email";'
          new = 'import { lineIdentityLoginEmail } from "../../../../../lib/line/identity-login-email";'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("LINE helper import anchor not found")
          path.write_text(text)
          Path(".github/workflows/one-time-fix-line-helper-import.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: use route-local LINE identity helper import"
          git push origin HEAD:fix/line-transfer-after-unbind
