name: One-time Main Staging Rollout PR46

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-main-staging-rollout-pr46.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: one-time-main-staging-rollout-pr46
  cancel-in-progress: false

jobs:
  orchestrate:
    name: Verify backup and launch protected staging rollout
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: staging
      url: ${{ vars.STAGING_BASE_URL }}
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Verify backup, run migration plan, and launch Go-Live
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const targetSha = process.env.GITHUB_SHA;
          const githubToken = process.env.GITHUB_TOKEN;
          const supabaseToken = process.env.SUPABASE_ACCESS_TOKEN;
          const projectRef = process.env.SUPABASE_PROJECT_REF;

          if (!repository || !/^[0-9a-f]{40}$/.test(targetSha ?? "")) throw new Error("Invalid rollout target.");
          if (!githubToken || !supabaseToken || !projectRef) throw new Error("Protected staging configuration is incomplete.");

          async function request(url, token, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${token}`,
                "content-type": "application/json",
                "x-github-api-version": "2022-11-28",
                ...(options.headers ?? {}),
              },
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`Protected API request failed with status ${response.status}.`);
            return text ? JSON.parse(text) : null;
          }

          const main = await request(`https://api.github.com/repos/${repository}/commits/main`, githubToken);
          if (main?.sha !== targetSha) throw new Error("Main moved after rollout started; refusing to deploy a different revision.");

          const project = await request(`https://api.supabase.com/v1/projects/${encodeURIComponent(projectRef)}`, supabaseToken);
          if (project?.ref !== projectRef || !/staging/i.test(String(project?.name ?? ""))) {
            throw new Error("Supabase project identity is not an approved staging project.");
          }

          const backupState = await request(
            `https://api.supabase.com/v1/projects/${encodeURIComponent(projectRef)}/database/backups`,
            supabaseToken,
          );
          const now = Date.now();
          const maxAgeMs = 36 * 60 * 60 * 1000;
          const completed = Array.isArray(backupState?.backups)
            ? backupState.backups.filter((backup) => String(backup?.status ?? "").toUpperCase() === "COMPLETED")
            : [];
          const latestLogicalMs = completed
            .map((backup) => Date.parse(String(backup?.inserted_at ?? "")))
            .filter(Number.isFinite)
            .sort((a, b) => b - a)[0] ?? 0;
          const latestPhysicalSeconds = Number(backupState?.physical_backup_data?.latest_physical_backup_date_unix ?? 0);
          const latestPhysicalMs = Number.isFinite(latestPhysicalSeconds) ? latestPhysicalSeconds * 1000 : 0;
          const latestBackupMs = Math.max(latestLogicalMs, latestPhysicalMs);
          if (!latestBackupMs || now - latestBackupMs > maxAgeMs || latestBackupMs > now + 5 * 60 * 1000) {
            throw new Error("No recent completed staging backup or PITR restore point was verified.");
          }
          console.log("Staging project identity and a recent backup were verified.");

          async function dispatchAndFind(workflow, inputs) {
            const startedAt = new Date(Date.now() - 5000).toISOString();
            await request(
              `https://api.github.com/repos/${repository}/actions/workflows/${workflow}/dispatches`,
              githubToken,
              { method: "POST", body: JSON.stringify({ ref: "main", inputs }) },
            );
            for (let attempt = 0; attempt < 60; attempt += 1) {
              const result = await request(
                `https://api.github.com/repos/${repository}/actions/workflows/${workflow}/runs?event=workflow_dispatch&branch=main&per_page=20`,
                githubToken,
              );
              const run = result?.workflow_runs?.find((candidate) =>
                candidate.head_sha === targetSha
                && candidate.event === "workflow_dispatch"
                && candidate.created_at >= startedAt
              );
              if (run) return run;
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw new Error(`The ${workflow} run could not be located.`);
          }

          async function waitForSuccess(run, attempts) {
            let current = run;
            for (let attempt = 0; attempt < attempts; attempt += 1) {
              current = await request(
                `https://api.github.com/repos/${repository}/actions/runs/${run.id}`,
                githubToken,
              );
              if (current.status === "completed") break;
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            if (current?.status !== "completed" || current?.conclusion !== "success") {
              throw new Error(`Workflow run ${run.id} did not complete successfully.`);
            }
            return current;
          }

          const plan = await dispatchAndFind("staging-release.yml", { operation: "plan" });
          await waitForSuccess(plan, 180);
          console.log(`Staging migration plan passed (run ${plan.id}).`);

          const goLive = await dispatchAndFind("staging-go-live.yml", {
            expected_sha: targetSha,
            plan_run_id: String(plan.id),
            confirmation: "LAUNCH-STAGING",
            backup_confirmation: "BACKUP-READY",
            provision_test_data: "false",
            provisioning_confirmation: "",
          });
          await waitForSuccess(goLive, 360);
          console.log(`Staging Go-Live passed (run ${goLive.id}).`);
          NODE
