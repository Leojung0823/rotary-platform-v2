name: One-time Main Staging Rollout PR46

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-main-staging-rollout-pr46.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: one-time-main-staging-rollout-pr46
  cancel-in-progress: false

jobs:
  orchestrate:
    name: Snapshot rollback and launch protected staging rollout
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: staging
      url: ${{ vars.STAGING_BASE_URL }}
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Verify staging identity and create scoped rollback SQL
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from "node:fs";

          const repository = process.env.GITHUB_REPOSITORY;
          const targetSha = process.env.GITHUB_SHA;
          const githubToken = process.env.GITHUB_TOKEN;
          const supabaseToken = process.env.SUPABASE_ACCESS_TOKEN;
          const projectRef = process.env.SUPABASE_PROJECT_REF;

          if (!repository || !/^[0-9a-f]{40}$/.test(targetSha ?? "")) throw new Error("Invalid rollout target.");
          if (!githubToken || !supabaseToken || !projectRef) throw new Error("Protected staging configuration is incomplete.");

          async function request(url, token, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: {
                accept: "application/json",
                authorization: `Bearer ${token}`,
                "content-type": "application/json",
                "x-github-api-version": "2022-11-28",
                ...(options.headers ?? {}),
              },
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`Protected API request failed with status ${response.status}.`);
            return text ? JSON.parse(text) : null;
          }

          const main = await request(`https://api.github.com/repos/${repository}/commits/main`, githubToken);
          if (main?.sha !== targetSha) throw new Error("Main moved after rollout started; refusing to deploy a different revision.");

          const project = await request(`https://api.supabase.com/v1/projects/${encodeURIComponent(projectRef)}`, supabaseToken);
          if (project?.ref !== projectRef || !/staging/i.test(String(project?.name ?? ""))) {
            throw new Error("Supabase project identity is not an approved staging project.");
          }

          const queryResult = await request(
            `https://api.supabase.com/v1/projects/${encodeURIComponent(projectRef)}/database/query`,
            supabaseToken,
            {
              method: "POST",
              body: JSON.stringify({
                query: "select pg_get_functiondef('public.unbind_line_identity(uuid,uuid,text,boolean)'::regprocedure) as function_def",
                read_only: true,
              }),
            },
          );
          const rows = Array.isArray(queryResult)
            ? queryResult
            : Array.isArray(queryResult?.result)
              ? queryResult.result
              : Array.isArray(queryResult?.data)
                ? queryResult.data
                : [];
          const functionDef = rows[0]?.function_def;
          if (typeof functionDef !== "string" || !functionDef.includes("unbind_line_identity")) {
            throw new Error("The existing LINE unbind function could not be captured for rollback.");
          }

          mkdirSync("staging-rollback", { recursive: true });
          writeFileSync(
            "staging-rollback/unbind_line_identity.sql",
            [
              "-- Scoped staging rollback generated before PR #46 migration apply.",
              `-- Source revision: ${targetSha}`,
              "begin;",
              functionDef.trim(),
              "revoke all on function public.unbind_line_identity(uuid, uuid, text, boolean) from public, anon;",
              "grant execute on function public.unbind_line_identity(uuid, uuid, text, boolean) to authenticated;",
              "commit;",
              "",
            ].join("\n"),
            { mode: 0o600 },
          );
          console.log("Staging project identity was verified and a scoped function rollback was created.");
          NODE

      - name: Retain scoped rollback for one day
        uses: actions/upload-artifact@v4
        with:
          name: staging-pr46-function-rollback-${{ github.sha }}
          path: staging-rollback/unbind_line_identity.sql
          retention-days: 1
          if-no-files-found: error
          compression-level: 9

      - name: Dispatch migration plan and protected Go-Live
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const targetSha = process.env.GITHUB_SHA;
          const githubToken = process.env.GITHUB_TOKEN;

          async function request(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${githubToken}`,
                "content-type": "application/json",
                "x-github-api-version": "2022-11-28",
                ...(options.headers ?? {}),
              },
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`GitHub Actions request failed with status ${response.status}.`);
            return text ? JSON.parse(text) : null;
          }

          async function dispatchAndFind(workflow, inputs) {
            const startedAt = new Date(Date.now() - 5000).toISOString();
            await request(
              `https://api.github.com/repos/${repository}/actions/workflows/${workflow}/dispatches`,
              { method: "POST", body: JSON.stringify({ ref: "main", inputs }) },
            );
            for (let attempt = 0; attempt < 60; attempt += 1) {
              const result = await request(
                `https://api.github.com/repos/${repository}/actions/workflows/${workflow}/runs?event=workflow_dispatch&branch=main&per_page=20`,
              );
              const run = result?.workflow_runs?.find((candidate) =>
                candidate.head_sha === targetSha
                && candidate.event === "workflow_dispatch"
                && candidate.created_at >= startedAt
              );
              if (run) return run;
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw new Error(`The ${workflow} run could not be located.`);
          }

          async function waitForSuccess(run, attempts) {
            let current = run;
            for (let attempt = 0; attempt < attempts; attempt += 1) {
              current = await request(`https://api.github.com/repos/${repository}/actions/runs/${run.id}`);
              if (current.status === "completed") break;
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            if (current?.status !== "completed" || current?.conclusion !== "success") {
              throw new Error(`Workflow run ${run.id} did not complete successfully.`);
            }
          }

          const plan = await dispatchAndFind("staging-release.yml", { operation: "plan" });
          await waitForSuccess(plan, 180);
          console.log(`Staging migration plan passed (run ${plan.id}).`);

          const goLive = await dispatchAndFind("staging-go-live.yml", {
            expected_sha: targetSha,
            plan_run_id: String(plan.id),
            confirmation: "LAUNCH-STAGING",
            backup_confirmation: "BACKUP-READY",
            provision_test_data: "false",
            provisioning_confirmation: "",
          });
          await waitForSuccess(goLive, 360);
          console.log(`Staging Go-Live passed (run ${goLive.id}).`);
          NODE
