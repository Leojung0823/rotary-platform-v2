<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d6eaa">
    <title>目前沒有網路｜扶輪管理平台</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; background: #f3f7fb; color: #172b4d; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 34rem); box-sizing: border-box; padding: 32px; border: 1px solid #c9d8e3; border-radius: 20px; background: #fff; box-shadow: 0 16px 40px rgb(23 43 77 / 12%); }
      h1 { margin: 0 0 12px; font-size: clamp(1.5rem, 5vw, 2rem); }
      p { margin: 0; color: #526b82; line-height: 1.7; }
      button { min-height: 48px; margin-top: 24px; padding: 10px 18px; border: 0; border-radius: 10px; background: #0d6eaa; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #f0b429; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>目前沒有網路</h1>
      <p>請確認手機網路或 Wi‑Fi 後再試。為了保護資料，離線時不會顯示或保存登入後的內容。</p>
      <button type="button" onclick="location.reload()">重新連線</button>
    </main>
  </body>
</html>
