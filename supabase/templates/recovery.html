<!doctype html>
<html lang="zh-Hant">
  <body style="font-family: sans-serif; color: #16212f; line-height: 1.7">
    <h1>重設扶輪平台密碼</h1>
    <p>請確認這封信是您本人要求的。請勿轉寄這個一次性連結。</p>
    <p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/reset-password">確認並重設密碼</a></p>
    <p>若您沒有提出要求，請忽略這封信。</p>
  </body>
</html>
